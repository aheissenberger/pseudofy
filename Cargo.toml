[package]
name = "pseudofy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Stable pseudonymization of names and email addresses in CSV and XLSX files"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
