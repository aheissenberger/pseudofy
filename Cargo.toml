[package]
name = "pseudofy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Stable pseudonymization of names and email addresses in CSV and XLSX files"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
csv = "=1.4.0"
getrandom = "=0.4.3"
globset = "=0.4.21"
hmac = "=0.13.0"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.1"
sys-locale = "=0.3.2"
toml = "=1.1.8"
unicode-normalization = "=0.1.26"
walkdir = "=2.5.0"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
