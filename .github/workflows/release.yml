# On a tag v*: run all checks in the devcontainer, build and test the macOS
# binary for Apple Silicon, then publish it with a provenance attestation
# (ADR-0005, specs 0005, 0011 and 0020). No other workflow exists.
#
# Three jobs with separate tokens:
#   check   - read token, runs the devcontainer checks, needs the tag on main
#   build   - read token, runs cargo, makes the tarball
#   publish - write token, runs no cargo and no third-party build step
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check that the tagged commit is on main
        run: |
          # The full ref name: a tag named origin/main must not win (spec 0020).
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::The tagged commit ${GITHUB_SHA} is not an ancestor of origin/main"
            exit 1
          fi

      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: ./scripts/check
          push: never

  build:
    needs: check
    runs-on: macos-15
    permissions:
      contents: read
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag equals the Cargo.toml version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not equal to the Cargo.toml version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Install the Rust version from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "${channel}" --profile minimal --target "${TARGET}"

      # Reproducible build: remove the runner paths from the binary.
      - name: Set the build environment
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "${GITHUB_ENV}"
          echo "RUSTFLAGS=--remap-path-prefix=${HOME}/.cargo=/cargo --remap-path-prefix=${GITHUB_WORKSPACE}=/build" >> "${GITHUB_ENV}"

      - name: Build
        run: cargo build --locked --release --target "${TARGET}"

      - name: Test the release build
        run: cargo test --locked --release --target "${TARGET}"

      - name: Run the binary
        run: |
          file "target/${TARGET}/release/pseudofy"
          "target/${TARGET}/release/pseudofy" --version

      # Reproducible tarball with the bsdtar of macOS 15 (no gtar needed):
      # --uid/--gid 0 and empty --uname/--gname give owner 0:0, --numeric-owner
      # keeps the ids, the file mtime is set from SOURCE_DATE_EPOCH with touch,
      # and gzip -n keeps the name and the time out of the gzip header.
      # The tarball holds one file, so the name order is fixed.
      - name: Package
        run: |
          name="pseudofy-${VERSION}-${TARGET}"
          mkdir dist stage
          cp -X "target/${TARGET}/release/pseudofy" stage/pseudofy
          chmod 0755 stage/pseudofy
          TZ=UTC0 touch -t "$(date -u -r "${SOURCE_DATE_EPOCH}" +%Y%m%d%H%M.%S)" stage/pseudofy
          COPYFILE_DISABLE=1 tar --create --format ustar --no-xattrs --no-acls --no-mac-metadata --numeric-owner --uid 0 --gid 0 --uname '' --gname '' \
            --file - -C stage pseudofy \
            | gzip -n > "dist/${name}.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: dist

      - name: Write the checksum file
        working-directory: dist
        run: |
          for file in *.tar.gz; do
            sha256sum "${file}" > "${file}.sha256"
          done
          cat ./*.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # Draft first, publish after the assets are in. The repository uses
      # immutable releases, so a published release cannot get new assets.
      - name: Create and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          gh release create "${TAG}" dist/*.tar.gz dist/*.sha256 \
            --repo "${REPO}" \
            --draft \
            --verify-tag \
            --title "pseudofy ${version}" \
            --notes 'macOS binary for Apple Silicon (aarch64-apple-darwin). See README.md, section "Install on macOS".'
          gh release edit "${TAG}" --repo "${REPO}" --draft=false
